name: youtube-to-telegram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Optional flags for notify.py (e.g. --test, --seed, --dry-run -v)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: yt-telegram-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: |
          # shellcheck disable=SC2086
          python notify.py --verbose $EXTRA_ARGS

      - name: Persist state
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "no state.json produced"
            exit 0
          fi
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): update seen videos [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
